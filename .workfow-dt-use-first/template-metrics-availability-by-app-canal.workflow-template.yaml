    run_javascript_4:
      name: run_javascript_4
      input:
        script: "import { metricsClient } from '@dynatrace-sdk/client-classic-environment-v2';\n\
          \n/**\n * ════════════════════════════════════════════════════════════════════════════\n\
          \ *  Ingesta de métricas — Canales Digitales Financieros\n *  Formato: MINT\
          \  →  <metricKey>,<dimensions> <value>\n *\n *  Métricas ingestadas (todas\
          \ correlacionadas entre sí):\n *    · app.availability          → % disponibilidad\
          \ del servicio\n *    · app.users.connected       → usuarios activos en\
          \ sesión\n *    · app.requests              → total de requests por minuto\
          \ (RPM)\n *    · app.request.errors        → errores HTTP 4xx y 5xx (derivados\
          \ del RPM)\n *    · app.transactions.revenue  → ingresos por transacciones\
          \ (S/ por minuto)\n *\n *  Lógica de coherencia:\n *    - Todos los valores\
          \ se derivan del estado de disponibilidad (availability).\n *    - A menor\
          \ disponibilidad → menos usuarios → menos requests → más errores\n *   \
          \   → menos revenue. Los números siempre cuentan la misma historia.\n *\
          \ ════════════════════════════════════════════════════════════════════════════\n\
          \ */\n\n// ── Catálogo de aplicaciones ──────────────────────────────────────────────────\n\
          \nconst applications = [\n  {\n    app: 'app-mobile-retail',   name: 'App\
          \ Mobile Retail',\n    environment: 'produccion',  canal: 'mobile',\n  \
          \  baseUsers: 12000,  baseRpm: 8500,  revenuePerTx: 45.00,\n  },\n  {\n\
          \    app: 'app-banca-personas',  name: 'BPI Banca Personas',\n    environment:\
          \ 'produccion',  canal: 'web',\n    baseUsers: 9500,   baseRpm: 6200,  revenuePerTx:\
          \ 180.00,\n  },\n  {\n    app: 'app-banca-empresas',  name: 'BIE Banca Empresas',\n\
          \    environment: 'produccion',  canal: 'web',\n    baseUsers: 3200,   baseRpm:\
          \ 4800,  revenuePerTx: 950.00,\n  },\n  {\n    app: 'web-transferencias',\
          \ name: 'PLIN Transferencias',\n    environment: 'produccion',  canal: 'mobile',\n\
          \    baseUsers: 18000,  baseRpm: 14000, revenuePerTx: 220.00,\n  },\n  {\n\
          \    app: 'portal-inversiones',  name: 'Portal de Inversiones',\n    environment:\
          \ 'produccion',  canal: 'web',\n    baseUsers: 1800,   baseRpm: 1200,  revenuePerTx:\
          \ 3200.00,\n  },\n  {\n    app: 'onboarding-digital',  name: 'Onboarding\
          \ Digital',\n    environment: 'produccion',  canal: 'web',\n    baseUsers:\
          \ 2400,   baseRpm: 1800,  revenuePerTx: 0.00,\n  },\n  {\n    app: 'core-pagos-api',\
          \      name: 'Core Pagos API',\n    environment: 'produccion',  canal: 'api',\n\
          \    baseUsers: 0,      baseRpm: 22000, revenuePerTx: 85.00,\n  },\n  {\n\
          \    app: 'cajero-virtual-atm',  name: 'Cajero Virtual ATM',\n    environment:\
          \ 'produccion',  canal: 'atm',\n    baseUsers: 5500,   baseRpm: 3800,  revenuePerTx:\
          \ 0.00,\n  },\n  {\n    app: 'app-seguros-vida',    name: 'App Seguros de\
          \ Vida',\n    environment: 'produccion',  canal: 'mobile',\n    baseUsers:\
          \ 4200,   baseRpm: 2900,  revenuePerTx: 620.00,\n  },\n  {\n    app: 'plataforma-creditos',\
          \ name: 'Plataforma de Créditos',\n    environment: 'produccion',  canal:\
          \ 'web',\n    baseUsers: 6800,   baseRpm: 5100,  revenuePerTx: 1400.00,\n\
          \  },\n];\n\n// ── Rangos de disponibilidad ──────────────────────────────────────────────────\n\
          \nconst RANGES = {\n  STABLE:   { min: 90,  max: 100 },   // operación normal\n\
          \  DEGRADED: { min: 80,  max: 89  },   // servicio degradado\n  OUTAGE:\
          \   { min: 0,   max: 79  },   // caída crítica\n};\n\n/**\n * Pesos para\
          \ modo estable (operación habitual):\n *   96 % → STABLE · 3 % → DEGRADED\
          \ · 1 % → OUTAGE\n */\nconst STABLE_WEIGHTS = { STABLE: 0.96, DEGRADED:\
          \ 0.03, OUTAGE: 0.01 };\n\n// ── Estado de disrupción activa ───────────────────────────────────────────────\n\
          \n/**\n * Map<appId, { type: 'OUTAGE'|'DEGRADED', expiresAt: number|null\
          \ }>\n * expiresAt = null  →  indefinida hasta clearDisruption()\n * expiresAt\
          \ = ms    →  auto-limpieza al vencer\n */\nconst activeDisruptions = new\
          \ Map();\n\n// ── Utilidades ────────────────────────────────────────────────────────────────\n\
          \n/** Número aleatorio con N decimales en [min, max]. */\nfunction randomInRange(min,\
          \ max, decimals = 2) {\n  return parseFloat((Math.random() * (max - min)\
          \ + min).toFixed(decimals));\n}\n\n/** Ruido gaussiano suave (±sigma) sobre\
          \ un valor base. */\nfunction jitter(base, sigma) {\n  // Box-Muller simplificado\n\
          \  const u = 1 - Math.random();\n  const v = Math.random();\n  const z =\
          \ Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);\n  return Math.max(0,\
          \ base + z * sigma);\n}\n\n/** Clasifica la disponibilidad y retorna etiqueta,\
          \ icono y tag MINT. */\nfunction getSeverity(availability) {\n  if (availability\
          \ <= 15) return { label: 'OUTAGE',   icon: '\U0001F534', tag: 'outage' \
          \  };\n  if (availability <= 79) return { label: 'DEGRADED', icon: '\U0001F7E1\
          ', tag: 'degraded' };\n  return                         { label: 'STABLE',\
          \   icon: '\U0001F7E2', tag: 'stable'   };\n}\n\n/** Elige rango ponderado\
          \ para modo estable. */\nfunction pickStableRange() {\n  const r = Math.random();\n\
          \  if (r < STABLE_WEIGHTS.OUTAGE)                             return 'OUTAGE';\n\
          \  if (r < STABLE_WEIGHTS.OUTAGE + STABLE_WEIGHTS.DEGRADED)  return 'DEGRADED';\n\
          \  return 'STABLE';\n}\n\n// ── Generación de disponibilidad (con soporte\
          \ de disrupción) ──────────────────\n\nfunction resolveAvailability(appId)\
          \ {\n  // Auto-limpiar disrupción vencida\n  const dis = activeDisruptions.get(appId);\n\
          \  if (dis && dis.expiresAt !== null && Date.now() > dis.expiresAt) {\n\
          \    activeDisruptions.delete(appId);\n    console.log(`  ⏱  Disrupción\
          \ vencida y limpiada: ${appId}`);\n  }\n\n  const active = activeDisruptions.get(appId);\n\
          \  if (active) {\n    const { min, max } = RANGES[active.type];\n    return\
          \ { availability: randomInRange(min, max), source: `DISRUPTION:${active.type}`\
          \ };\n  }\n\n  const rangeName   = pickStableRange();\n  const { min, max\
          \ } = RANGES[rangeName];\n  return { availability: randomInRange(min, max),\
          \ source: `STABLE_MODE:${rangeName}` };\n}\n\n// ── Motor de métricas coherentes\
          \ ─────────────────────────────────────────────\n\n/**\n * Genera el conjunto\
          \ completo de métricas para una aplicación.\n *\n * Relaciones de coherencia:\n\
          \ *\n *  healthFactor = availability / 100\n *\n *  users    = baseUsers\
          \  × healthFactor  (± ruido 3 %)\n *  requests = baseRpm    × healthFactor\
          \  (± ruido 2 %)\n *\n *  Tasa de error base:\n *    STABLE   →  0.5 – 2\
          \ %  de requests totales (casi todo 2xx)\n *    DEGRADED →  5 – 15 %   de\
          \ requests totales\n *    OUTAGE   → 40 – 80 %   de requests totales\n *\n\
          \ *  Distribución de errores:\n *    4xx (errores de cliente / autenticación)\
          \ ≈ 30 % de los errores\n *    5xx (errores de servidor / timeout)     \
